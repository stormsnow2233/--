<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>后台导入</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-header">
        <h1>后台管理</h1>
        <div class="header-actions">
          <a href="/" style="text-decoration:none;">
            <button class="secondary" type="button">返回网盘</button>
          </a>
        </div>
      </header>

      <div class="admin-layout">
        <aside class="panel folders-panel">
          <div class="panel-header-row">
            <h2>文件结构</h2>
            <button id="createFolderBtn" class="primary small" type="button">新建文件夹</button>
          </div>
          <div class="folder-nav">
            <button id="backFolderBtn" type="button" class="secondary small">返回上级</button>
            <div id="folderBreadcrumb" class="folder-breadcrumb">根目录</div>
          </div>
          <div class="tree-caption">目录结构</div>
          <div id="folderTree" class="folder-tree" aria-label="目录结构"></div>
        </aside>

        <main class="admin-main">
          <section class="panel form-panel">
            <h2>粘贴分享文本</h2>
            <p class="mini-hint import-constraint"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> 仅支持<b>单文件</b>分享链接。文件夹、或一次性分享多个文件的链接无法解析，会在校验后被忽略。</p>
            <label for="adminSecretInput" style="display:block;margin-bottom:8px;font-weight:600;">管理密钥</label>
            <input id="adminSecretInput" type="password" placeholder="请输入管理密钥" style="margin-bottom:12px;" />
            <textarea id="importInput" placeholder="每行一个分享链接（仅单文件）。支持百度 / 夸克 / 阿里云盘 / 迅雷 / 天翼 / 123 / 115 / Google Drive / OneDrive / Dropbox / MEGA。&#10;例如：&#10;链接: https://pan.baidu.com/s/1abc 提取码: a54m&#10;https://drive.google.com/file/d/1abc/view&#10;https://1drv.ms/u/s!AbCdEf"></textarea>

            <div class="batch-actions">
              <button id="parseBtn" class="secondary" type="button">解析预览</button>
              <button id="submitBatchBtn" class="primary" type="button">确认导入</button>
            </div>

            <p id="batchMessage" class="message" aria-live="polite"></p>
          </section>

          <section id="previewWrap" class="panel preview-box">
            <h2>预览与微调</h2>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>网盘</th>
                    <th>链接</th>
                    <th>提取码</th>
                    <th>大小</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="parsedTableBody"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <h2>当前目录内容</h2>
            <div id="currentFolderLabel" class="current-folder-label">当前目录：根目录</div>

            <div id="batchBar" class="batch-bar hidden">
              <span id="batchCount" class="batch-count">已选 0 项</span>
              <div class="batch-bar-actions">
                <button id="batchSelectAll" class="secondary small" type="button">全选本页</button>
                <button id="batchClear" class="secondary small" type="button">取消选择</button>
                <button id="batchDelete" class="danger small" type="button">删除所选</button>
              </div>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th class="col-check"><input id="batchToggleAll" type="checkbox" aria-label="全选本页" /></th>
                    <th>名称</th>
                    <th>类型</th>
                    <th>大小/链接</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="folderItemsBody"></tbody>
              </table>
            </div>
          </section>

          <section class="panel thank-you-panel">
            <h2>感谢名单设置</h2>
            <p class="mini-hint">一行一个名称，保存后以纯文本显示。</p>
            <textarea id="thankYouEditor" placeholder="例如：&#10;澎湃OS&#10;VoltageOS&#10;LightOS"></textarea>
            <div class="batch-actions">
              <button id="saveThankYouBtn" class="primary" type="button">保存名单</button>
            </div>
          </section>

          <section class="panel announcement-editor-panel">
            <h2>主页公告</h2>
            <p class="mini-hint">支持 Markdown，保存后主页打开时会自动显示。</p>
            <textarea id="announcementEditor" placeholder="输入主页公告内容"></textarea>
            <div class="batch-actions">
              <button id="saveAnnouncementBtn" class="primary" type="button">保存公告</button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="createFolderModal" class="folder-modal hidden" aria-hidden="true">
      <div class="folder-modal-panel">
        <h3>新建文件夹</h3>
        <label for="createFolderInput" class="folder-modal-label">请输入文件夹名称</label>
        <input id="createFolderInput" type="text" maxlength="80" placeholder="新建文件夹" />
        <div class="folder-modal-actions">
          <button id="createFolderCancel" type="button" class="secondary">取消</button>
          <button id="createFolderConfirm" type="button" class="primary">确认创建</button>
        </div>
      </div>
    </div>

    <div id="batchDeleteModal" class="folder-modal hidden" aria-hidden="true">
      <div class="folder-modal-panel">
        <h3>确认删除</h3>
        <div id="batchDeleteSummary" class="batch-delete-summary"></div>
        <div id="batchDeleteList" class="batch-delete-list"></div>
        <p class="batch-delete-warn">删除后无法恢复；文件夹会连同其中所有内容一起删除。</p>
        <div class="folder-modal-actions">
          <button id="batchDeleteCancel" type="button" class="secondary">取消</button>
          <button id="batchDeleteConfirm" type="button" class="danger">确认删除</button>
        </div>
      </div>
    </div>

    <script src="/parser.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
