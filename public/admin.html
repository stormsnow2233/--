<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台导入</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-header">
        <h1>后台管理</h1>
        <div class="header-actions">
          <a href="/" style="text-decoration:none;">
            <button class="secondary" type="button">返回网盘</button>
          </a>
        </div>
      </header>

      <div class="admin-layout">
        <aside class="panel folders-panel">
          <div class="panel-header-row">
            <h2>文件结构</h2>
            <button id="createFolderBtn" class="primary small" type="button">新建文件夹</button>
          </div>
          <div class="folder-nav">
            <button id="backFolderBtn" type="button" class="secondary small">返回上级</button>
            <div id="folderBreadcrumb" class="folder-breadcrumb">根目录</div>
          </div>
          <div id="folderTree" class="folder-tree"></div>
        </aside>

        <main class="admin-main">
          <section class="panel form-panel">
            <h2>粘贴分享文本</h2>
            <label for="adminSecretInput" style="display:block;margin-bottom:8px;font-weight:600;">管理密钥</label>
            <input id="adminSecretInput" type="password" placeholder="请输入管理密钥" style="margin-bottom:12px;" />
            <textarea id="importInput" placeholder="例如：&#10;我分享了「VSCode.zip」链接：https://pan.baidu.com/s/1abc 提取码: 1234&#10;IDEA破解补丁.7z | https://www.123pan.com/s/def | 8888 | 15MB"></textarea>

            <div class="batch-actions">
              <button id="parseBtn" class="secondary" type="button">解析预览</button>
              <button id="submitBatchBtn" class="primary" type="button">确认导入</button>
            </div>

            <p id="batchMessage" class="message" aria-live="polite"></p>
          </section>

          <section id="previewWrap" class="panel preview-box">
            <h2>预览与微调</h2>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>链接</th>
                    <th>提取码</th>
                    <th>大小</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="parsedTableBody"></tbody>
              </table>
            </div>
          </section>

          <section class="panel upload-panel">
            <h2>上传到当前目录</h2>
            <div class="upload-row">
              <input id="uploadFileInput" type="file" />
              <button id="uploadBtn" class="primary" type="button">上传文件</button>
            </div>
            <div id="currentFolderLabel" class="current-folder-label">当前目录：根目录</div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>类型</th>
                    <th>大小/链接</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="folderItemsBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="/parser.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
