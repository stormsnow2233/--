<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>网盘资源库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="openlist-shell">
      <header class="site-header">
        <div class="brand-wrap">
          <div class="brand-mark">V</div>
          <div class="brand-text">K50电竞版ROM小站</div>
        </div>
        <div class="view-switcher" aria-label="视图切换">
          <button class="view-button active" data-view="list" type="button" title="列表视图"><i class="fa-solid fa-list"></i></button>
          <button class="view-button" data-view="grid" type="button" title="网格视图"><i class="fa-solid fa-grip"></i></button>
        </div>
      </header>

      <div class="content-panel">
        <div class="page-toolbar">
          <div id="folderBreadcrumb" class="window-badge"><i class="fa-solid fa-house"></i> 首页</div>
          <div class="toolbar-actions">
            <button id="backFolderBtn" class="icon-action" type="button" title="返回上级"><i class="fa-solid fa-arrow-left"></i></button>
            <button id="refreshBtn" class="icon-action" type="button" title="刷新"><i class="fa-solid fa-rotate-right"></i></button>
          </div>
        </div>

        <div class="search-panel">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input id="resourceSearch" class="resource-search" type="text" placeholder="搜索资源" aria-label="搜索资源" />
        </div>

        <section class="list-panel">
          <div class="list-header">
            <div class="col-name">名称</div>
            <div class="col-size">大小</div>
            <div class="col-date">修改时间</div>
          </div>
          <div id="desktopGrid" class="desktop-grid" aria-live="polite"></div>
          <div id="pagination" class="pagination" aria-label="资源分页"></div>
        </section>
      </div>
    </main>

    <div class="thank-you-footer">
      <button id="openThankYouList" class="thank-you-link" type="button">感谢名单</button>
    </div>

    <div id="thankYouModal" class="thank-you-modal hidden" aria-hidden="true">
      <div class="thank-you-modal-panel">
        <div class="thank-you-modal-header">
          <h3>感谢名单</h3>
          <button id="closeThankYouModal" class="secondary small" type="button">关闭</button>
        </div>
        <div id="thankYouList" class="thank-you-list"></div>
        <div id="thankYouPagination" class="thank-you-pagination" aria-label="感谢名单分页"></div>
      </div>
    </div>

    <div id="announcementModal" class="announcement-modal hidden" aria-hidden="true">
      <div class="announcement-panel" role="dialog" aria-modal="true" aria-label="公告">
        <button id="closeAnnouncement" class="announcement-close" type="button" title="关闭公告" aria-label="关闭公告"><i class="fa-solid fa-xmark"></i></button>
        <div id="announcementContent" class="announcement-body"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
