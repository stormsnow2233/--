<!DOCTYPE html>
<html lang="zh-CN" class="is-first-paint">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>网盘资源库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/styles.css?v=1.2.6" />
    <noscript>
      <style>
        /* Without scripting nothing lifts the first-paint gate. */
        html.is-first-paint body:has(.openlist-shell) .openlist-shell {
          opacity: 1 !important;
          pointer-events: auto !important;
          animation: none !important;
        }
        html.is-first-paint body:has(.openlist-shell)::before {
          opacity: 1 !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="wallpaperLayer" class="wallpaper-layer" aria-hidden="true"></div>
    <main class="openlist-shell">
      <header class="site-header">
        <div class="brand-wrap">
          <div class="brand-mark">V</div>
          <div class="brand-text">K50电竞版ROM小站</div>
        </div>
        <div class="view-switcher" aria-label="视图切换">
          <button class="view-button active" data-view="list" type="button" title="列表视图"><i class="fa-solid fa-list"></i></button>
          <button class="view-button" data-view="grid" type="button" title="网格视图"><i class="fa-solid fa-grip"></i></button>
        </div>
      </header>

      <div class="content-panel">
        <div class="page-toolbar">
          <div id="folderBreadcrumb" class="window-badge"><i class="fa-solid fa-house"></i> 首页</div>
          <div class="toolbar-actions">
            <button id="changeWallpaperBtn" class="icon-action" type="button" title="切换壁纸"><i class="fa-solid fa-image"></i></button>
            <button id="backFolderBtn" class="icon-action" type="button" title="返回上级"><i class="fa-solid fa-arrow-left"></i></button>
            <button id="refreshBtn" class="icon-action" type="button" title="刷新"><i class="fa-solid fa-rotate-right"></i></button>
          </div>
        </div>

        <section id="folderDescription" class="folder-description announcement-body" aria-label="文件夹简介"></section>

        <div class="search-panel">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input id="resourceSearch" class="resource-search" type="text" placeholder="搜索所有文件夹中的资源" aria-label="搜索所有文件夹中的资源" />
        </div>

        <section class="resource-stats" aria-label="资源统计" aria-live="polite">
          <div class="resource-stat">
            <i class="fa-solid fa-file-lines" aria-hidden="true"></i>
            <div>
              <span class="resource-stat-label">已收录文件</span>
              <strong id="resourceFileCount">—</strong>
            </div>
          </div>
          <div class="resource-stat">
            <i class="fa-solid fa-database" aria-hidden="true"></i>
            <div>
              <span class="resource-stat-label">文件总容量</span>
              <strong id="resourceTotalSize">—</strong>
              <span id="resourceSizeNote" class="resource-stat-note"></span>
            </div>
          </div>
        </section>

        <section class="list-panel">
          <div class="list-header">
            <div class="col-name">名称</div>
            <div class="col-size">大小</div>
            <div class="col-date">修改时间</div>
          </div>
          <div id="resourceLoadNotice" class="resource-load-notice" role="alert">
            <span><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> 刷新失败</span>
            <button type="button" data-retry-items>重试</button>
          </div>
          <div id="desktopGrid" class="desktop-grid" aria-live="polite" aria-busy="true"></div>
          <div id="pagination" class="pagination" aria-label="资源分页"></div>
        </section>
        <details id="thankYouCard" class="thank-you-card">
          <summary class="thank-you-toggle">
            <span class="thank-you-avatar" aria-hidden="true"><i class="fa-solid fa-heart"></i></span>
            <span class="thank-you-toggle-title">作者与鸣谢</span>
            <span class="thank-you-toggle-hint">感谢 ROM 作者、维护者与收集协助者</span>
            <i class="fa-solid fa-chevron-down thank-you-toggle-chevron" aria-hidden="true"></i>
          </summary>
          <div id="thankYouCardBody" class="thank-you-card-body announcement-body"></div>
        </details>
      </div>
    </main>

    <div id="announcementModal" class="announcement-modal hidden" aria-hidden="true">
      <div class="announcement-panel" role="dialog" aria-modal="true" aria-label="公告">
        <div class="announcement-heading">
          <span class="announcement-icon"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i></span>
          <div>
            <span class="announcement-kicker">NOTICE</span>
            <h2>公告</h2>
          </div>
        </div>
        <button id="closeAnnouncement" class="announcement-close" type="button" title="关闭公告" aria-label="关闭公告"><i class="fa-solid fa-xmark"></i></button>
        <div id="announcementContent" class="announcement-body"></div>
        <section class="latest-uploads" aria-labelledby="latestUploadsHeading">
          <h3 id="latestUploadsHeading">最新上传 <span class="latest-uploads-badge">NEW</span></h3>
          <div id="latestUploadsList" class="latest-uploads-list" aria-live="polite"></div>
        </section>
      </div>
    </div>

    <button id="backToTopBtn" class="back-to-top-btn" type="button" title="回到顶部" aria-label="回到顶部">
      <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script src="/app.js?v=1.2.6"></script>
  </body>
</html>
